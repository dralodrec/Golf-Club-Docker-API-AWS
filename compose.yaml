services:

  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: golf_club_db
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}

    volumes:
      - golfclub_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build: .

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: golf_club_db
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

volumes:
  golfclub_data: