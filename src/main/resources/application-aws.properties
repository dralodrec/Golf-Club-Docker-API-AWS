# ==================================
# AWS RDS CONFIGURATION
# ==================================

spring.config.import=optional:file:./.env.aws[.properties]

# Application
spring.application.name=GolfClubApi-AWS
server.port=8080

# AWS RDS MySQL
spring.datasource.url=jdbc:mysql://${AWS_DB_HOST}:${AWS_DB_PORT:3306}/${AWS_DB_NAME:golf_club_db}?sslMode=VERIFY_IDENTITY

spring.datasource.username=${AWS_DB_USERNAME}
spring.datasource.password=${AWS_DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY

spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:${AWS_TRUSTSTORE_PATH}

spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12

spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${AWS_TRUSTSTORE_PASSWORD}